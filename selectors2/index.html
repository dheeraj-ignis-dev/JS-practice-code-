<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1 id="heading">Hello World!</h1>

    <ul id="list">
        <li>HTML</li>
    </ul>

    <button id="btn" class="btn">Change Text</button>


    <div class="outer">
        <button>Click me</button>
    </div>

    <script>

        let heading = document.querySelector("#heading");
        let button = document.querySelector(".btn");
        let list = document.querySelector("#list");


        button.addEventListener("click", function () {

            let newItem = document.createElement("li");
            newItem.textContent = "Css";
            list.appendChild(newItem);
        });

        document.querySelector('.outer').addEventListener('click', () => console.log('outer bubble'));
        document.querySelector('button').addEventListener('', () => console.log('button'));


    </script>

</body>

</html>
